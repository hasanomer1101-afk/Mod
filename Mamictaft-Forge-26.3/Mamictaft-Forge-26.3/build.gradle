plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0,)'
}

group = 'com.mamictaft'
version = mod_version

java { toolchain.languageVersion = JavaLanguageVersion.of(25) }

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        client {
            workingDir project.file('run')
            systemProperty 'forge.logging.console.level', 'debug'
        }
        server {
            workingDir project.file('run')
            args '--nogui'
        }
    }
}

repositories { maven { url = 'https://minecraftforge.net' } }

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
}

processResources {
    inputs.property 'version', mod_version
    filesMatching('META-INF/mods.toml') { expand 'version': mod_version }
}
